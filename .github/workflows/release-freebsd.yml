name: Release FreeBSD pkg CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-freebsd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-freebsd:
    name: FreeBSD 15 amd64 package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install package and extract CLI on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.3
        with:
          release: "15.0"
          arch: x86_64
          mem: 4096
          cpu: 2
          prepare: |
            pkg update -f
            pkg install -y grok-build
          run: |
            set -eu

            package_version=$(pkg query '%v' grok-build)
            binary=$(pkg query '%Fp' grok-build | awk '$0 == "/usr/local/bin/grok"')
            test -n "$binary"
            test -x "$binary"

            archive="grok-build-${package_version}-freebsd15-amd64.tar.gz"
            staging="dist/grok-build-${package_version}-freebsd15-amd64"
            rm -rf dist
            mkdir -p "$staging"
            install -m 0755 "$binary" "$staging/grok"

            file "$staging/grok"
            file "$staging/grok" | grep -q 'ELF 64-bit.*x86-64'
            tar -C dist -czf "dist/$archive" "$(basename "$staging")"
            sha256 "dist/$archive" > "dist/$archive.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-freebsd15-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
