name: Release native FreeBSD CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-freebsd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-freebsd
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/freebsd15-amd64
  RIPGREP_VERSION: 15.0.0

jobs:
  build-freebsd:
    name: Native FreeBSD 15 amd64 release
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Cargo and target cache
        uses: actions/cache@v4
        with:
          path: |
            .cargo-freebsd/registry
            .cargo-freebsd/git
            target/freebsd15-amd64
          key: freebsd15-amd64-rust-1.97-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            freebsd15-amd64-rust-1.97-
            freebsd15-amd64-

      - name: Build native CLI on FreeBSD
        uses: vmactions/freebsd-vm@v1.5.3
        with:
          release: "15.0"
          arch: x86_64
          mem: 8192
          cpu: 4
          cache-after-prepare: true
          envs: CARGO_HOME CARGO_TARGET_DIR RIPGREP_VERSION
          prepare: |
            pkg update -f
            pkg install -y bash cmake git gmake nasm perl5 pkgconf protobuf python3 rust
          run: |
            set -eu

            rustc --version
            cargo --version
            mkdir -p "$CARGO_HOME" "$CARGO_TARGET_DIR" .freebsd-tools

            cargo install \
              --locked \
              --version "$RIPGREP_VERSION" \
              --root "$PWD/.freebsd-tools" \
              --no-default-features \
              ripgrep

            cargo fetch --locked
            python3 - <<'PY'
            from pathlib import Path

            needle = '''            #[cfg(target_os = "linux")]
            let key = (cap.resolved.clone(), cap.is_file);
            '''
            fallback = needle + '''            #[cfg(not(any(target_os = "linux", target_os = "macos")))]
            let key = (cap.original.clone(), cap.is_file);
            '''
            matches = list(Path(".cargo-freebsd/registry/src").glob("*/nono-0.53.0/src/capability.rs"))
            if len(matches) != 1:
                raise SystemExit(f"expected one nono-0.53.0 source, found {len(matches)}")
            path = matches[0]
            source = path.read_text()
            if "target_os = \"freebsd\"" not in source:
                if needle not in source:
                    raise SystemExit("nono capability.rs layout changed; refusing an unsafe patch")
                path.write_text(source.replace(needle, fallback, 1))
            PY

            export GROK_TOOLS_BUNDLE_RG_PATH="$PWD/.freebsd-tools/bin/rg"
            cargo build \
              --locked \
              --release \
              --package xai-grok-pager-bin \
              --bin xai-grok-pager \
              --features release-dist

            version=$(awk '
              /^name = "xai-grok-pager-bin"$/ { package = 1; next }
              package && /^version = / {
                gsub(/version = |"/, "")
                print
                exit
              }
            ' Cargo.lock)
            test -n "$version"

            archive="grok-build-${version}-freebsd15-amd64.tar.gz"
            staging="dist/grok-build-${version}-freebsd15-amd64"
            rm -rf dist
            mkdir -p "$staging"
            install -m 0755 "$CARGO_TARGET_DIR/release/xai-grok-pager" "$staging/grok"
            install -m 0644 LICENSE THIRD-PARTY-NOTICES "$staging/"

            file "$staging/grok"
            file "$staging/grok" | grep -q 'FreeBSD'
            "$staging/grok" --version
            tar -C dist -czf "dist/$archive" "$(basename "$staging")"
            sha256 "dist/$archive" > "dist/$archive.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: grok-build-native-freebsd15-amd64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
